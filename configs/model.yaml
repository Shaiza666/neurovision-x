# Architecture. Baseline is a 3D U-Net. Attention U-Net is the Phase 3 comparison.
# Transformer variants remain optional (H3).

name: unet3d
framework: pytorch
optional_monai: true

in_channels: 4
out_channels: 4  # background, NCR, ED, ET
features: [16, 32, 64, 128]
num_res_units: 2
dropout: 0.1
norm: instance
activation: PReLU

# Nested BraTS regions are derived from class logits in evaluation, not extra heads.
output_layout: classes  # ncr, ed, et

# early = channel concatenation (baseline). se = optional Hu 2018 stem in front of the same backbone.
fusion: early
fusion_reduction: 2

variants:
  unet3d:
    enabled: true
    note: "Cicek et al., MICCAI 2016. Default baseline. Do not edit unet3d.py for fusion; use fusion: se."
  attention_unet3d:
    enabled: true
    note: "Oktay et al., MIDL 2018 attention gates. Set name to attention_unet3d to train it."
  unetr:
    enabled: false
    note: "Deferred unless GPU memory allows a matched H3 comparison."
