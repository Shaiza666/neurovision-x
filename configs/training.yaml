# Training and evaluation. Seeds and run metadata are required.

seed: 2026
deterministic: true
device: auto  # cuda if available else cpu
grad_clip: 1.0
validate_every: 1
compute_hd95_on_val: false  # expensive; full-volume HD95 is in scripts/evaluate.py

optim:
  name: adamw
  lr: 0.0001
  weight_decay: 0.00001
  scheduler: none  # none | plateau (ReduceLROnPlateau on the monitored val metric)
  scheduler_factor: 0.5
  scheduler_patience: 5

schedule:
  epochs: 50
  batch_size: 1
  patch_size: [96, 96, 96]
  sw_batch_size: 2
  amp: true
  infer_overlap: 0.5

loss:
  dice_weight: 1.0
  ce_weight: 1.0
  boundary_weight: 0.0  # set >0 to test H1
  boundary_classes: null  # null = all foreground; [3] = ET only
  include_background: false
  smooth: 1.0e-5
  class_weight_mode: inverse_freq  # none | inverse_freq | fixed
  class_weights: null  # used when class_weight_mode is fixed

uncertainty:
  method: mc_dropout  # mc_dropout | tta | none
  samples: 10
  aggregate: patient_mean_entropy

logging:
  experiments_dir: experiments
  save_every_epoch: 1
  require_real_data: true

early_stopping:
  metric: dice_et
  mode: max
  patience: 15

smoke:
  epochs: 2
  n_train: 4
  n_val: 2
  batch_size: 1
  patch_size: [16, 16, 16]
  features: [8, 16]
