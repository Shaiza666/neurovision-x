[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovisionx"
version = "0.3.0"
description = "Research-grade 3D medical image segmentation (not a clinical device)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NeuroVision-X contributors" }]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
research = [
  "torch>=2.1",
  "monai>=1.3",
  "nibabel>=5.2",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]
app = [
  "opencv-python>=4.9",
  "onnxruntime>=1.17",
  "streamlit>=1.32",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
